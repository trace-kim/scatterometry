[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rcwa-masksim"
version = "0.1.0"
description = "RCWA solver (rcwa) and photomask simulation layer (masksim)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.11",
]

[project.optional-dependencies]
# main.py, analyze_scatterometry.py, compare_rcwa_fresnel.py
scripts = ["scipy>=1.14", "matplotlib>=3.9"]
# masksim.plots (Plotly figures for notebooks)
plots = ["plotly>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["rcwa", "masksim"]
